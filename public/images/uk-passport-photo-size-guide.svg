<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 720 600"><rect width="720" height="600" rx="24" fill="#f1f5e8"/><g font-family="Arial,sans-serif" fill="#253d2e"><text x="38" y="52" font-size="22" font-weight="700">PixPassVisa</text><text x="38" y="91" font-size="13" fill="#63764e">UK PASSPORT PHOTO SIZE GUIDE</text><text x="38" y="145" font-size="32" font-weight="700">Printed and digital.</text><text x="38" y="183" font-size="32" font-weight="700">Different requirements.</text><rect x="38" y="220" width="307" height="300" rx="16" fill="white"/><rect x="365" y="220" width="317" height="300" rx="16" fill="white"/><text x="60" y="253" font-size="13" font-weight="700">PRINTED PHOTO</text><path d="M128 283h128v165H128z" fill="#f7f9f2" stroke="#779455" stroke-width="2" stroke-dasharray="5 4"/><text x="158" y="276" font-size="12">35 mm</text><text x="267" y="371" font-size="12">45 mm</text><circle cx="192" cy="335" r="25" fill="none" stroke="#779455" stroke-width="2"/><path d="M153 405v-13a39 39 0 0 1 78 0v13" fill="none" stroke="#779455" stroke-width="2"/><text x="167" y="433" font-size="13">7:9</text><text x="60" y="477" font-size="18" font-weight="700">35 × 45 mm</text><text x="60" y="500" font-size="12">Head height: 29–34 mm</text><text x="387" y="253" font-size="13" font-weight="700">DIGITAL APPLICATION</text><rect x="405" y="286" width="234" height="158" rx="10" fill="#f0f5e6"/><text x="425" y="323" font-size="19" font-weight="700">At least 600 × 750 px</text><text x="425" y="353" font-size="16">50 KB–10 MB</text><text x="425" y="385" font-size="13">Use your unaltered original.</text><text x="425" y="408" font-size="13">Do not crop own-device photos.</text><text x="387" y="479" font-size="15" font-weight="700">Follow GOV.UK upload rules</text><text x="387" y="501" font-size="12">A download is not an HMPO code.</text><text x="38" y="558" font-size="11" fill="#63764e">Reference diagram, not an acceptance result. Source: GOV.UK photo guidance.</text></g></svg>
